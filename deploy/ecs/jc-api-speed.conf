# /etc/systemd/system/jc-api.service.d/speed.conf
#
# 云端**再钳一次**速度（第四道闸）。`cloud/api/app.py` 里：
#   MAX_LINEAR  = float(os.environ.get('JC_MAX_LINEAR', '0.15'))
#   MAX_ANGULAR = float(os.environ.get('JC_MAX_ANGULAR', '0.6'))
#   linear  = clamp(linear,  MAX_LINEAR)
#   angular = clamp(angular, MAX_ANGULAR)
#
# 2026-11-26：底盘单轮 300 → 400 mm/s 后，手机摇杆推满仍是 0.30 ——
# 就是 ECS 上 JC_MAX_LINEAR=0.30 卡的（页面/桥/底盘都已经是 0.40）。
# 这里设成 0.40 / 0.74，与页面 MAX_LINEAR/MAX_ANGULAR 和车端 mqtt_bridge 对齐。
# ⚠️ 改完必须 daemon-reload + restart jc-api 才对**新**指令生效。
# ⚠️ 这三处（页面 / 云端 env / 车端桥）任何一个比其它小，摇杆推满就只到最小那个。
[Service]
Environment=JC_MAX_LINEAR=0.40
Environment=JC_MAX_ANGULAR=0.74
