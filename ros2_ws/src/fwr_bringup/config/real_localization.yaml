amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_mapping
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    # 2026-10-30：房间结构重复时，"随机粒子注入"（recovery_alpha_*）会把粒子撒到
    # 别的地方，表现为**车没动位姿却跳了几米**。这里关掉随机注入，靠里程计+扫描维持，
    # 位姿真丢了就重新播种（tools/seed_amcl.py）。
    min_particles: 1000
    max_particles: 5000
    max_beams: 120
    laser_min_range: 0.12
    laser_max_range: 8.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.5
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: map
    frame_id: map
    # 2026-11-02：实测 map_server 以 ~30 Hz 重发地图，AMCL 每收到一次就重初始化
    # 粒子，位姿永远稳不下来 → 控制器连续 abort、车不动。
    # 显式设为 0（只在激活时发一次）。
    map_publish_period: 0.0
