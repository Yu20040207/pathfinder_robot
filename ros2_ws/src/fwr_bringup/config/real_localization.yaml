amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_mapping
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    # 走廊等重复结构下 500–2000 粒子容易落到错误极值；加大粒子数与观测数量，
    # 并打开 AMCL 自带的随机粒子注入（recovery_alpha_*），让错误收敛能自己爬回来。
    min_particles: 1000
    max_particles: 5000
    max_beams: 120
    laser_min_range: 0.12
    laser_max_range: 8.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.5
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: map
    frame_id: map
