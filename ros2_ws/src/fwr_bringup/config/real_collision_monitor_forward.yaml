# Forward-only collision zones for supervised trials.
collision_monitor_forward:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_auto_unchecked
    cmd_vel_out_topic: /cmd_vel_auto_forward_filtered
    transform_tolerance: 0.2
    # 雷达扫描的 header 时间是扫描起始时刻，实际到达时已 0.25–0.36 s 旧；
    # 0.25 s 会间歇性整帧丢弃，导致安全层时有时无。
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 18.0
    polygons: [front_stop, front_slow]
    # 停车区从车头外缘 0.30 m 起、只留 0.08 m 深度：0.06 m/s 下制动距离约 1 cm，
    # 8 cm 余量仍足够；再往里（0.20–0.30 m）已经在车体内部，不会有外部回波，等于关掉防撞。
    front_stop:
      type: polygon
      # 横向只比车体（±0.215 m）宽 3.5 cm：窄于 0.62 m 的门框/墙不再误触发停车，
      # 但正前方 0.30–0.38 m 内的实体仍会停。
      # 2026-10-29：原来 1 个点就 stop，导致车头 30~42cm 处一个噪点/侧向物体
      # 就把整台车锁死（连原地旋转都被禁止，Nav2 的 spin 脱困因此必然失败）。
      # 半宽 0.24（刚好略超车体 0.215，兼顾窄门通过），并要求 3 个点才触发。
      # 2026-11-01：停车区必须足够浅，否则"原地转身脱困"永远被否决
      # （车头 0.34~0.39 m 有障碍时，连左转都不许，现场表现为原地左右抖）。
      # 车体前缘在 0.30 m，因此 0.28~0.33 只拦真正的贴脸；
      # 0.33 以外由 front_slow（0.30~0.75）负责减速，仍有 2 级保护。
      # 2026-11-01：0.28~0.33 太浅，实车直接撞墙（车体前缘 0.30，等于没有余量）。
      # 恢复 0.32~0.45：车头 0.32 m 内有实体就停，留 2~15 cm 安全余量。
      # 脱困不再依赖"原地转身"，而是靠倒车（rear_guard 阈值已放到 0.15，
      # 倒车是允许的），所以停车区可以恢复到安全值。
      # 2026-11-01（用户要求"卡住能脱困，转个角度出去就行"）：
      # 现场实测卡住时车头 0.24 m，而停车区深度 0.32 → **连原地旋转都被清零**，
      # 车完全不动，转向指令到不了底盘。
      # 收到 0.22 m：只要车头还有 22 cm 就允许原地转身脱困；
      # 直行仍受 front_slow（0.30~0.75）限速，且 0.22 m 已接近车体前缘 0.30，
      # 真正的贴脸（<0.22）依然会停。
      # 2026-11-02：深度 0.45 太深 —— 车斜着过门时门框进入该区域，
      # 触发 "Robot to stop due to front_stop"，Nav2 随即放弃目标。
      # 收到 0.38：车体前缘 0.30 之外仍有 8 cm 余量，
      # 同时满足护栏（起点 ≥0.30、跨度 ≤0.20）。
      # 2026-11-04（用户："靠近门口速度慢"）：半宽 0.24 比车体（±0.215）宽 2.5 cm，
      # 过门时门框正好落在矩形**角点**（横向 ±0.24、前方 0.32~0.38）→
      # 实测 42 次 front_stop，其中一段**连续清零 12.2 秒**导致车卡在门口。
      # 收到 0.22（车体 0.215 + 5 mm，是护栏允许的最小值；0.21 会窄过车体，
      # 有 test_collision_stop_zones_keep_in_place_rotation_usable 守着不许再小）：
      # 门框只有真正贴近车身才会停；防撞深度 0.32~0.38 不变。
      points: [0.32, 0.22, 0.38, 0.22, 0.38, -0.22, 0.32, -0.22]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor_forward/front_stop
      enabled: true
    front_slow:
      type: polygon
      # 2026-11-02（用户反馈"贴墙走、转弯、进出门时速度突然变慢"）：
      # 实测 front_slow 一次跑动触发 7 次。原因是慢行区横向 ±0.30 m，
      # 比车宽（±0.215）宽出 8.5 cm —— 侧墙和门框都会扫进来；
      # 而且 max_points=1，一个点就触发，来回开关造成"一卡一卡"。
      # 改成：横向 ±0.22（只比车宽 0.5 cm）、3 个点才触发、减速温和到 0.8。
      # 2026-11-02（门口中段变慢的主因）：原来深到 0.75 m，
      # 穿过门时"对面门框"正好落在 0.5~0.7 m 的前方 → 触发 20% 减速。
      # 收到 0.50 m：门框在 0.5 m 外不再触发，真正逼近（<0.5 m）仍减速；
      # 停车区 front_stop（0.38 m）不变，安全兜底还在。
      points: [0.30, 0.22, 0.50, 0.22, 0.50, -0.22, 0.30, -0.22]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.8
      visualize: true
      polygon_pub_topic: /collision_monitor_forward/front_slow
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
