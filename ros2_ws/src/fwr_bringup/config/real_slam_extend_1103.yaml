slam_toolbox:
  ros__parameters:
    use_sim_time: false
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan_mapping
    mode: mapping
    # 2026-11-03 扩建：以 real_map_2026-10-28 的 posegraph 为基准继续建图。
    # 当前导航地图 real_map_manual_1101 是它的裁剪版（ros_map_edit 生成，
    # 世界坐标一致：1101 origin(-2.35,-14.9) 在 2026-10-28 origin(-12.5,-15.7)
    # 的范围内），所以这里可以直接沿用它的 posegraph。
    map_file_name: /home/manbaout/Company_Project/Four-wheel-robot/ros2_ws/src/fwr_bringup/maps/real_map_2026-10-28
    # 车在旧图中的起始位姿 —— 2026-11-03 09:xx 从 AMCL 读到的实际位姿。
    # ⚠️ 启动建图瞬间车必须**就在这个位姿**，否则新老地图会错位。
    map_start_pose: [15.302, -9.157, 1.167]

    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 12.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    map_update_interval: 0.5
    throttle_scans: 1
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
