bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 2026-11-02（用户反复遇到"到了起点就不动"）：
      # 目标点若落在膨胀区内，SmacPlanner2D 会把终点吸附到最近的空闲格，
      # 实测偏差 0.34 m；而容差只有 0.20 m → goal_checker 永远判不"到达"，
      # 任务卡在 active 状态但不再下发速度。
      # 容差放宽到 0.40，覆盖吸附偏差。
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 3.1416
    FollowPath:
      # 差速底盘：每条新路径先原地转到路径朝向（Rotation Shim），
      # 再交给 Regulated Pure Pursuit 跟踪；避免"螺旋外扩"式大半径起步。
      # Humble 版 shim 的 primary_controller 是字符串，RPP 参数与它同级。
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 2026-11-02 更正：底盘是**双驱动轮 + 两个万向轮**（URDF 可查），
      # 不是四轮刮擦底盘，弧线转弯没有阻力问题。原注释有误，已更正。
      # 角度阈值放大到 80°：只有接近反向时才原地转，其余情况走弧线。
      # 2026-10-29：1.4 rad(80°) 意味着只有偏得离谱才原地先转向；
      # 窄处/贴障碍时改成 0.6 rad(34°) 先转向再走，避免直接顶上去报 collision。
      # 2026-10-30：0.6 rad(34°) 太敏感——路径一转弯就原地转，用户反馈“转向太过头”。
      # 恢复 1.2 rad(69°)：普通绕障边走边转，只有大偏差才原地对准。
      # 2026-11-01（用户反馈"路径左右徘徊"）：
      # 1.2 rad ≈ 69° 太大 —— 车头偏 30° 时 shim 不介入，RPP 边前进边纠偏，
      # 于是左右摇摆。降到 0.35 rad(20°)：偏差超过 20° 就先原地转正再走。
      # 2026-11-02（实测门口变慢的主因）：0.35 rad(20°) 太敏感 ——
      # 门洞处路径拐弯就触发"原地转"，线速度强制归零（实测 150 s 内 4 次）。
      # 底盘是**双驱动轮 + 万向轮**（URDF: left/right_drive_wheel + caster），
      # 无刮擦阻力，弧线过弯完全可行，因此放宽到 0.6 rad(34°)：
      # 只有大偏差（接近反向）才停下原地对准。
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.30
      # 2026-10-31 减少重影：雷达 10 Hz 扫一圈 0.1 s，
      # 0.8 rad/s 时车每帧转 4.6°，转角处点云被拉斜 → 同一面墙出现双线。
      # 降到 0.45 rad/s（每帧 2.6°），拖影明显减小。
      # 2026-11-02（用户反馈"车头对准方向很慢"）：0.45 rad/s 转 90° 要 3.5 秒，
      # 提到 0.6（90° 约 2.6 秒）。过冲由下面的 max_angular_accel 4.0 约束。
      rotate_to_heading_angular_vel: 0.6
      # 角加速度也降一点，转弯起步/收尾更平滑，减少"甩头"
      # 2026-11-01（用户反馈"转弯一卡一卡"）：2.0 起步太软，加减速拖尾明显。
      # 提到 4.0，转动响应更干脆。
      max_angular_accel: 4.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # 2026-10-30：原 0.06 m/s 太慢（建图时设的），导航恢复 0.15。
      # 2026-10-31 建图时降速：0.15→0.12，扫描拖影更少（重影主要来源之一）
      # 2026-10-31 用户反馈"速度太快"：巡航降到 0.10，
      # 并把 velocity_smoother 的硬上限压到 0.12（原来 0.18，实际会冲过头）
      # 2026-11-02（用户要求）：直线快、转弯慢、切换丝滑。
      # 0.10 太保守；回到之前验证过的 0.15。
      desired_linear_vel: 0.15
      # 前视距离必须大于车长（0.60 m）才有稳定裕度：
      # 0.30 m 时车头前方只有半个车身，微小横向误差就产生大角速度 → 左右摆动。
      # 2026-11-01（清单 C4）：低速时前视 0.55 m 太远，遇到窄处会"抄近路"贴障碍。
      # 打开速度自适应前视：0.10 m/s 巡航时前视约 0.30~0.45 m，转弯更贴合路径。
      # 前视距离加长：0.45→0.60（下限 0.30→0.40）。
      # 前视太短会"追着车轮跑"，一点点偏差就大幅打方向 → 左右摆。
      lookahead_dist: 0.60
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.85
      # 曲率越大线速度越低（转弯自动减速），配合下面的平滑器实现"丝滑"切换
      # 2026-11-02 回退：开启后控制器每帧 abort、/cmd_vel 无输出（车不动）。
      # 疑似曲率限速把线速度压到接近 0，RPP 判定"无进展"。
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.06
      use_velocity_scaled_lookahead_dist: true
      # Shim 已在路径起步时原地对准航向；RPP 再做一次“转-走-转”会形成
      # 极限环，表现为转弯一顿一顿。路径跟踪只保留前进 + 小角速度修正。
      # 2026-11-02：试过打开（想让车先转正），
      # 但单测 test_real_frames_speed_and_recovery_policy 明确禁止：
      # 航向对准交给 RotationShim，RPP 再开会形成极限环。已回退。
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      # 2026-10-31 回退：曾把 allow_reversing 设为 true（方案 B），但实测出问题 ——
      # 规划器不知道车尾守卫会拒绝倒车：RPP 选择倒车 → base_bridge 拒绝 →
      # 车不动 → "Controller patience exceeded" → 目标失败 → 探索器重发 → 死循环
      # （现场表现为"一直在原地左右转"）。
      # 改为 false：Nav2 只走前进路径，需要脱困时由专门的恢复动作显式倒车。
      allow_reversing: false
      # 2026-10-30：局部膨胀 0.20 < 内切半径 0.215，RPP 的碰撞预测频繁误判
      # （“detected collision ahead!” → patience exceeded → Goal failed）。
      # 真实障碍由 collision_monitor（原始雷达，30-45 cm 停车区）兜底，关掉 RPP 的重复判定。
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_approach_linear_velocity: 0.05
      transform_tolerance: 0.2
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      # 每周期清掉机器人脚下的致命格：否则贴墙时膨胀会盖住自身，
      # RPP 判 "detected collision ahead" 直接拒绝移动（2026-10-29 实测）。
      footprint_clearing_enabled: true
      plugins:
      - obstacle_layer
      # 2026-11-02：**移除 range_layer**。
      # 它会报 "No range readings received for 2.6 s"，把局部代价地图的更新卡住，
      # 导致控制器拿不到新鲜代价地图 → computeVelocityCommands 失败 →
      # follow_path 每秒 abort、/cmd_vel_nav 恒 0（长距离第 2 腿必卡）。
      # 倒车安全已由 rear_guard → /base/rear_blocked 独立保障，代价地图不需要这层。
      - inflation_layer
      # 2026-10-31 后向 A22 超声（4 路 sensor_msgs/Range，见 ultrasonic_rear 节点）：
      #   · clear_threshold: 0.0  → 永不清除已有障碍（激光发现的不会被超声抹掉）
      #   · clear_on_max_reading: false → 读到超量程也不当"空地"
      #   · 只把测到的近距障碍标记成占用 → 后退时能停车
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 局部代价地图：0.20（略小于内切半径 0.215，允许贴墙通过；
        # 真实障碍由 collision_monitor 用原始雷达兜底）。
        # 2026-10-30：0.20 时代价梯度过弱 → 规划器贴障碍走 → 碰撞监控停车。
        # 膨胀是“代价”不是“墙”，0.30 仍可穿过 0.86 m 门（只是代价高）。
        # 2026-10-31 回退：0.40 在窄场地里把通道整片压成高代价/不可通行，
        # 规划不出路径（现场"之前能过的地方现在过不去"）。回到 0.30。
        # 2026-11-01（用户反馈"路径贴着门角走"）：
        # inflation_radius 只影响**代价梯度**，不封路，所以调大是安全的。
        # 0.30 只比车体内切半径 0.215 多一点，路径没有空间离开墙。
        # 提到 0.45：路径会主动保持在墙 0.3~0.4 m 外，门洞照样能过。
        inflation_radius: 0.48
        # 2026-10-30：cost_scaling_factor 3.0 时代价衰减太快，缓冲区形同虚设；
        # 降到 2.0 让 0.30 m 缓冲带整体保持高代价，规划器才会绕开。
        # 2026-10-31 二次调整：3.0 衰减太快 → 规划器觉得"贴墙便宜"，
        # 实测路径离墙只有 0.18 m。回到 2.0，让 0.40 m 缓冲带整体保持高代价。
        cost_scaling_factor: 1.2
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # 用缝合后的地图：细缝被封住，门洞不受影响
        map_topic: /map_sealed
        # 2026-10-31：Humble 里 footprint_clearing 在图层命名空间下。
        # 打开后静态层会清掉机器人自身足迹 → 贴墙时不会把自己判成致命格(99)，
        # 否则规划器无法从致命格起步，报"规划失败（找不到路径）"。
        footprint_clearing_enabled: true
      always_send_full_costmap: true
      footprint_padding: 0.02
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      # 2026-11-01：**写死尺寸**。原来不给 width/height，StaticLayer 会跟着
      # /map_sealed 的尺寸变；Cartographer 地图每长一次就 "Resizing costmap"，
      # 最终把 SmacPlanner 搞成 segfault（exit -11），并出现
      # "Sensor origin at (-30,0) is out of map bounds"。
      # 44x40 m @ (-24,-32)：实机地图覆盖 x[-20.2,16.7] y[-29.6,5.8] ✓ 留余量；
      # 仿真 14x14 m 世界在原点附近 ✓ 也够用。
      width: 880
      height: 800
      origin_x: -24.0
      origin_y: -32.0
      # 2026-11-01：车贴着墙时，规划器为了让机器人"离开贴身障碍"，
      # 会把路径头几个点穿过那个致命格（实测致命点在 x≈-0.4, y≈-0.3，
      # 就在车身边上）。打开足迹清除，每帧把机器人自身足迹内的格子清成自由。
      footprint_clearing_enabled: true
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      resolution: 0.05
      # 2026-11-01：改回 false。试过 true：未知区太多，三组路径全部规划失败
      # （地图里大片未探索区域把可行通道堵死）。
      # 「路径穿墙」的正确解法是**把地图建完整**（or map_seal 把墙缝封住），
      # 而不是让规划器害怕未知。
      track_unknown_space: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # 用缝合后的地图：细缝被封住，门洞不受影响
        map_topic: /map_sealed
        # 2026-10-31：Humble 里 footprint_clearing 在图层命名空间下。
        # 打开后静态层会清掉机器人自身足迹 → 贴墙时不会把自己判成致命格(99)，
        # 否则规划器无法从致命格起步，报"规划失败（找不到路径）"。
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 2026-10-29：现场门宽 ≈0.86 m（两个车宽）。膨胀 R 时通道净宽 = 0.86-2R：
        #   R=0.24 → 0.38 m < 车宽 0.43 m → 过不了门（实测规划失败）
        #   R=0.20 → 0.46 m > 0.43 m → 能过
        # 取 0.20（与局部一致）；真实障碍由 collision_monitor（原始雷达）兜底。
        # 2026-10-30：0.20 时代价梯度过弱 → 规划器贴障碍走 → 碰撞监控停车。
        # 膨胀是“代价”不是“墙”，0.30 仍可穿过 0.86 m 门（只是代价高）。
        # 2026-10-31 回退：0.40 在窄场地里把通道整片压成高代价/不可通行，
        # 规划不出路径（现场"之前能过的地方现在过不去"）。回到 0.30。
        # 2026-11-01（用户反馈"路径贴着门角走"）：
        # inflation_radius 只影响**代价梯度**，不封路，所以调大是安全的。
        # 0.30 只比车体内切半径 0.215 多一点，路径没有空间离开墙。
        # 提到 0.45：路径会主动保持在墙 0.3~0.4 m 外，门洞照样能过。
        inflation_radius: 0.48
        # 2026-10-30：cost_scaling_factor 3.0 时代价衰减太快，缓冲区形同虚设；
        # 降到 2.0 让 0.30 m 缓冲带整体保持高代价，规划器才会绕开。
        # 2026-10-31 二次调整：3.0 衰减太快 → 规划器觉得"贴墙便宜"，
        # 实测路径离墙只有 0.18 m。回到 2.0，让 0.40 m 缓冲带整体保持高代价。
        cost_scaling_factor: 1.2
      always_send_full_costmap: true
      footprint_padding: 0.02
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      max_planning_time: 2.0
      # 2026-10-30：本版本 SmacPlanner2D 没有 cost_penalty 参数（设了也不生效），
      # 真正起作用的是 cost_travel_multiplier：搜索时对高代价格的放大倍数。
      # 3.0 时规划器几乎无视膨胀代价 → 路径贴着障碍 → front_stop 停车。
      # 2026-10-31：曾降到 4.0（嫌绕远），但实测路径贴障碍太近（0.18~0.35 m）。
      # **恢复为现场验证过的 8.0**：宁可绕一点，也不要贴着障碍走。
      # 2026-11-02（用户要求：路径走门洞中间）：
      # multiplier 越大 → 代价权重越高 → 规划器更愿意"绕到低代价区"（门洞正中），
      # 而不是抄近路贴门框。8.0 → 20.0。
      # 2026-11-02 回退：20.0 实测对路径居中毫无改善，却可能导致规划失败
      # （用户报告"以前能规划的门洞现在规划不过去"）。回到验证过的 8.0。
      cost_travel_multiplier: 8.0
      # 速度提高后网格阶梯路径会放大成左右摆动；加大平滑权重、略降数据贴合。
      # 2026-10-30 现场验证过的权重（平滑优先，避免贴障碍的大弧）
      smoother:
        w_smooth: 0.45
        w_data: 0.15
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    - spin
    wait:
      plugin: nav2_behaviors/Wait
    spin:
      plugin: nav2_behaviors/Spin
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    # 2.0 s 的旋转前视在车距墙 0.45 m 时就会预判碰撞 → spin 立刻失败（实测 0.8 s 就 abort）。
    # 收到 0.5 s：只前视半秒，窄处也能执行恢复旋转；真实碰撞仍由 collision_monitor 兜底。
    simulate_ahead_time: 0.5
    # 恢复转向：单次 60°，角速度 0.7 rad/s（两轮各 92 mm/s，仍在固件上限内）。
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.6
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.12
    - 0.0
    - 1.0
    min_velocity:
    - 0.0
    - 0.0
    - -1.0
    # 2026-11-01：平滑器的角加速度/减速度也放宽（2.0→4.0 / -2.5→-4.5），
    # 否则 RPP 每帧改角速度时会被平滑器拖住，表现为一顿一顿。
    # 2026-11-02：起步/收尾更干脆（0.5→0.8、-0.6→-0.9），
    # 配合 RPP 的曲率限速（转弯 0.06~0.15、直道 0.15）实现"直线快、转弯慢、切换丝滑"。
    max_accel:
    - 0.8
    - 0.0
    - 4.0
    max_decel:
    - -0.9
    - 0.0
    - -4.5
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.2
