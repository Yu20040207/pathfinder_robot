controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.1416
    FollowPath:
      # 差速底盘：每条新路径先原地转到路径朝向（Rotation Shim），
      # 再交给 Regulated Pure Pursuit 跟踪；避免"螺旋外扩"式大半径起步。
      # Humble 版 shim 的 primary_controller 是字符串，RPP 参数与它同级。
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 四轮刮擦阻力大，原地转向最容易顶死（固件 fault 1 = 堵转）。
      # 角度阈值放大到 80°：只有接近反向时才原地转，其余情况走弧线。
      # 2026-10-29：1.4 rad(80°) 意味着只有偏得离谱才原地先转向；
      # 窄处/贴障碍时改成 0.6 rad(34°) 先转向再走，避免直接顶上去报 collision。
      # 2026-10-30：0.6 rad(34°) 太敏感——路径一转弯就原地转，用户反馈“转向太过头”。
      # 恢复 1.2 rad(69°)：普通绕障边走边转，只有大偏差才原地对准。
      angular_dist_threshold: 1.2
      forward_sampling_distance: 0.30
      # 2026-10-31 减少重影：雷达 10 Hz 扫一圈 0.1 s，
      # 0.8 rad/s 时车每帧转 4.6°，转角处点云被拉斜 → 同一面墙出现双线。
      # 降到 0.45 rad/s（每帧 2.6°），拖影明显减小。
      rotate_to_heading_angular_vel: 0.45
      # 角加速度也降一点，转弯起步/收尾更平滑，减少"甩头"
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # 2026-10-30：原 0.06 m/s 太慢（建图时设的），导航恢复 0.15。
      # 2026-10-31 建图时降速：0.15→0.12，扫描拖影更少（重影主要来源之一）
      # 2026-10-31 用户反馈"速度太快"：巡航降到 0.10，
      # 并把 velocity_smoother 的硬上限压到 0.12（原来 0.18，实际会冲过头）
      desired_linear_vel: 0.10
      # 前视距离必须大于车长（0.60 m）才有稳定裕度：
      # 0.30 m 时车头前方只有半个车身，微小横向误差就产生大角速度 → 左右摆动。
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.75
      use_velocity_scaled_lookahead_dist: false
      # Shim 已在路径起步时原地对准航向；RPP 再做一次“转-走-转”会形成
      # 极限环，表现为转弯一顿一顿。路径跟踪只保留前进 + 小角速度修正。
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      # 2026-10-31 回退：曾把 allow_reversing 设为 true（方案 B），但实测出问题 ——
      # 规划器不知道车尾守卫会拒绝倒车：RPP 选择倒车 → base_bridge 拒绝 →
      # 车不动 → "Controller patience exceeded" → 目标失败 → 探索器重发 → 死循环
      # （现场表现为"一直在原地左右转"）。
      # 改为 false：Nav2 只走前进路径，需要脱困时由专门的恢复动作显式倒车。
      allow_reversing: false
      # 2026-10-30：局部膨胀 0.20 < 内切半径 0.215，RPP 的碰撞预测频繁误判
      # （“detected collision ahead!” → patience exceeded → Goal failed）。
      # 真实障碍由 collision_monitor（原始雷达，30-45 cm 停车区）兜底，关掉 RPP 的重复判定。
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_approach_linear_velocity: 0.05
      transform_tolerance: 0.2
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      # 每周期清掉机器人脚下的致命格：否则贴墙时膨胀会盖住自身，
      # RPP 判 "detected collision ahead" 直接拒绝移动（2026-10-29 实测）。
      footprint_clearing_enabled: true
      plugins:
      - obstacle_layer
      - range_layer          # 后向四路超声：只加占用，不清除激光障碍
      - inflation_layer
      # 2026-10-31 后向 A22 超声（4 路 sensor_msgs/Range，见 ultrasonic_rear 节点）：
      #   · clear_threshold: 0.0  → 永不清除已有障碍（激光发现的不会被超声抹掉）
      #   · clear_on_max_reading: false → 读到超量程也不当"空地"
      #   · 只把测到的近距障碍标记成占用 → 后退时能停车
      range_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        topics: ['/ultrasonic_rear/left_out', '/ultrasonic_rear/left_in',
                 '/ultrasonic_rear/right_in', '/ultrasonic_rear/right_out']
        input_sensor_type: INPUT_ULTRASOUND
        clear_on_max_reading: false
        clear_threshold: 0.0
        no_readings_timeout: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 局部代价地图：0.20（略小于内切半径 0.215，允许贴墙通过；
        # 真实障碍由 collision_monitor 用原始雷达兜底）。
        # 2026-10-30：0.20 时代价梯度过弱 → 规划器贴障碍走 → 碰撞监控停车。
        # 膨胀是“代价”不是“墙”，0.30 仍可穿过 0.86 m 门（只是代价高）。
        # 2026-10-31 回退：0.40 在窄场地里把通道整片压成高代价/不可通行，
        # 规划不出路径（现场"之前能过的地方现在过不去"）。回到 0.30。
        inflation_radius: 0.30
        # 2026-10-30：cost_scaling_factor 3.0 时代价衰减太快，缓冲区形同虚设；
        # 降到 2.0 让 0.30 m 缓冲带整体保持高代价，规划器才会绕开。
        # 2026-10-31 二次调整：3.0 衰减太快 → 规划器觉得"贴墙便宜"，
        # 实测路径离墙只有 0.18 m。回到 2.0，让 0.40 m 缓冲带整体保持高代价。
        cost_scaling_factor: 2.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # 用缝合后的地图：细缝被封住，门洞不受影响
        map_topic: /map_sealed
        # 2026-10-31：Humble 里 footprint_clearing 在图层命名空间下。
        # 打开后静态层会清掉机器人自身足迹 → 贴墙时不会把自己判成致命格(99)，
        # 否则规划器无法从致命格起步，报"规划失败（找不到路径）"。
        footprint_clearing_enabled: true
      always_send_full_costmap: true
      footprint_padding: 0.02
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      resolution: 0.05
      # 2026-10-31：这里保持 false（未知=可通行），否则前沿目标点会被拒；
      # 「路径穿墙」改由 map_seal 节点缝合地图缺口来解决（静态层读 /map_sealed）。
      track_unknown_space: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # 用缝合后的地图：细缝被封住，门洞不受影响
        map_topic: /map_sealed
        # 2026-10-31：Humble 里 footprint_clearing 在图层命名空间下。
        # 打开后静态层会清掉机器人自身足迹 → 贴墙时不会把自己判成致命格(99)，
        # 否则规划器无法从致命格起步，报"规划失败（找不到路径）"。
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 2026-10-29：现场门宽 ≈0.86 m（两个车宽）。膨胀 R 时通道净宽 = 0.86-2R：
        #   R=0.24 → 0.38 m < 车宽 0.43 m → 过不了门（实测规划失败）
        #   R=0.20 → 0.46 m > 0.43 m → 能过
        # 取 0.20（与局部一致）；真实障碍由 collision_monitor（原始雷达）兜底。
        # 2026-10-30：0.20 时代价梯度过弱 → 规划器贴障碍走 → 碰撞监控停车。
        # 膨胀是“代价”不是“墙”，0.30 仍可穿过 0.86 m 门（只是代价高）。
        # 2026-10-31 回退：0.40 在窄场地里把通道整片压成高代价/不可通行，
        # 规划不出路径（现场"之前能过的地方现在过不去"）。回到 0.30。
        inflation_radius: 0.30
        # 2026-10-30：cost_scaling_factor 3.0 时代价衰减太快，缓冲区形同虚设；
        # 降到 2.0 让 0.30 m 缓冲带整体保持高代价，规划器才会绕开。
        # 2026-10-31 二次调整：3.0 衰减太快 → 规划器觉得"贴墙便宜"，
        # 实测路径离墙只有 0.18 m。回到 2.0，让 0.40 m 缓冲带整体保持高代价。
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
      footprint_padding: 0.02
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      max_planning_time: 2.0
      # 2026-10-30：本版本 SmacPlanner2D 没有 cost_penalty 参数（设了也不生效），
      # 真正起作用的是 cost_travel_multiplier：搜索时对高代价格的放大倍数。
      # 3.0 时规划器几乎无视膨胀代价 → 路径贴着障碍（0.32~0.45 m）→ front_stop 停车。
      # 8.0 又太怕障碍 → 到处绕远路（现场看到路线乱拐）。
      # 2026-10-31：折中到 4.0，并加强平滑器的"贴合规划路径"权重。
      cost_travel_multiplier: 4.0
      # 速度提高后网格阶梯路径会放大成左右摆动；加大平滑权重、略降数据贴合。
      # w_data 提高（0.15→0.30）：平滑后更贴合规划器给的路径，避免被拉成大弧；
      # w_smooth 降低（0.45→0.30）：减少过度平滑造成的"绕圈感"。
      smoother:
        w_smooth: 0.30
        w_data: 0.30
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    - spin
    wait:
      plugin: nav2_behaviors/Wait
    spin:
      plugin: nav2_behaviors/Spin
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    # 2.0 s 的旋转前视在车距墙 0.45 m 时就会预判碰撞 → spin 立刻失败（实测 0.8 s 就 abort）。
    # 收到 0.5 s：只前视半秒，窄处也能执行恢复旋转；真实碰撞仍由 collision_monitor 兜底。
    simulate_ahead_time: 0.5
    # 恢复转向：单次 60°，角速度 0.7 rad/s（两轮各 92 mm/s，仍在固件上限内）。
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.6
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.12
    - 0.0
    - 1.0
    min_velocity:
    - 0.0
    - 0.0
    - -1.0
    max_accel:
    - 0.4
    - 0.0
    - 2.0
    max_decel:
    - -0.5
    - 0.0
    - -2.5
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.2
