bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # 2026-11-02：原来 10 ms(100 Hz)。实测日志报 \"Behavior Tree tick rate 100.00 was exceeded\"，

    # BT 线程被饿死 → 目标看似 active 但不再下发速度（车停在空地不动）。

    # 降到 50 ms(20 Hz)：导航不需要 100 Hz，20 Hz 足够且稳定。

    bt_loop_duration: 50
