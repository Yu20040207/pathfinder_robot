bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.1416
    FollowPath:
      # 差速底盘：每条新路径先原地转到路径朝向（Rotation Shim），
      # 再交给 Regulated Pure Pursuit 跟踪；避免"螺旋外扩"式大半径起步。
      # Humble 版 shim 的 primary_controller 是字符串，RPP 参数与它同级。
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 四轮刮擦阻力大，原地转向最容易顶死（固件 fault 1 = 堵转）。
      # 角度阈值放大到 80°：只有接近反向时才原地转，其余情况走弧线。
      # 2026-10-29：1.4 rad(80°) 意味着只有偏得离谱才原地先转向；
      # 窄处/贴障碍时改成 0.6 rad(34°) 先转向再走，避免直接顶上去报 collision。
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.30
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      desired_linear_vel: 0.18
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      # Shim 已在路径起步时原地对准航向；RPP 再做一次“转-走-转”会形成
      # 极限环，表现为转弯一顿一顿。路径跟踪只保留前进 + 小角速度修正。
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_approach_linear_velocity: 0.05
      transform_tolerance: 0.2
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      # 每周期清掉机器人脚下的致命格：否则贴墙时膨胀会盖住自身，
      # RPP 判 "detected collision ahead" 直接拒绝移动（2026-10-29 实测）。
      footprint_clearing_enabled: true
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 局部代价地图：0.20（略小于内切半径 0.215，允许贴墙通过；
        # 真实障碍由 collision_monitor 用原始雷达兜底）。
        inflation_radius: 0.20
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      footprint_padding: 0.02
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: '[[0.30, 0.215], [0.30, -0.215], [-0.30, -0.215], [-0.30, 0.215]]'
      resolution: 0.05
      # 未知格致命会挡住“到前沿探索”的目标点（前沿本身在未知里）；
      # 关掉后未知=可通行，真实障碍仍由局部代价地图与碰撞监控拦截。
      track_unknown_space: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_mapping
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # 0.45 会让贴墙停车的机器人自身处于致命格（规划直接失败），改 0.30
        # 2026-10-29：现场门宽 ≈0.86 m（两个车宽）。膨胀 R 时通道净宽 = 0.86-2R：
        #   R=0.24 → 0.38 m < 车宽 0.43 m → 过不了门（实测规划失败）
        #   R=0.20 → 0.46 m > 0.43 m → 能过
        # 取 0.20（与局部一致）；真实障碍由 collision_monitor（原始雷达）兜底。
        inflation_radius: 0.20
      always_send_full_costmap: true
      footprint_padding: 0.02
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      max_planning_time: 2.0
      cost_travel_multiplier: 3.0
      # 速度提高后网格阶梯路径会放大成左右摆动；加大平滑权重、略降数据贴合。
      smoother:
        w_smooth: 0.45
        w_data: 0.15
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    - spin
    wait:
      plugin: nav2_behaviors/Wait
    spin:
      plugin: nav2_behaviors/Spin
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    # 2.0 s 的旋转前视在车距墙 0.45 m 时就会预判碰撞 → spin 立刻失败（实测 0.8 s 就 abort）。
    # 收到 0.5 s：只前视半秒，窄处也能执行恢复旋转；真实碰撞仍由 collision_monitor 兜底。
    simulate_ahead_time: 0.5
    # 恢复转向：单次 60°，角速度 0.7 rad/s（两轮各 92 mm/s，仍在固件上限内）。
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.6
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.18
    - 0.0
    - 1.0
    min_velocity:
    - 0.0
    - 0.0
    - -1.0
    max_accel:
    - 0.4
    - 0.0
    - 2.0
    max_decel:
    - -0.5
    - 0.0
    - -2.5
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.2
