# 视点规划器参数（自动建图专用，默认 enabled: false = 完全不影响现有行为）
viewpoint_planner:
  ros__parameters:
    enabled: false            # ← 只有显式打开才会参与建图
    sensor_range_m: 6.0       # 有效射程（C1 可到 8 m，留余量）
    rays: 180                 # 射线数；必须与 fill 匹配（6 m 处间隔 ~0.5 m → 需 180 条）
    fill_cells: 2             # 射线缝隙填充（模拟雷达扇面，否则只标记'射线经过的线'）
    candidate_step_m: 1.0     # 候选视点网格
    clearance_m: 0.25         # 视点离墙最小距离（车体半径 + 余量）
    inset_m: 0.40             # 前沿扩展时，目标离未知边界的距离
    radius_start_m: 4.0       # 初始搜索半径（房间尺度，天然"先扫本房间"）
    radius_max_m: 8.0         # 半径上限，超过就转去"门口扩展"
    cover_target: 0.90        # 视点阶段的目标覆盖率（剩下的交给扩展）
    min_gain_cells: 400       # 新增可见格 <1 m² 就不值得跑（实测 12 会陷入抠细节）
    batch_size: 3             # 滚动续点：始终保留 3 个点在前面（途经不停车）
    lookahead: 3              # 队列里保留的点数
    refill_at: 2              # 剩余点 <= 这个数就提前补新点并重发路线
    waypoint_reach_m: 0.9     # 距队首小于此值算"已通过"该点
    dwell_s: 1.0              # 到点停留（3 秒会明显"走一段停一下"；1 秒够雷达转 10 帧）
    hop_timeout_s: 45.0       # 单跳超时
    arrive_m: 0.45            # 判定"到了"的距离
    replan_period_s: 1.0      # 决策周期
    turn_weight: 0.4          # 航向连续性惩罚；1A 回放验证：四房全过、翻转 39 次
    map_topic: /map
    # 门控：自己开运动门（与 supervisor 同一套接口）
    open_gate: true           # false = 只计算不派目标（纯离线调试）
    gate_timeout_s: 60.0      # 无活动多久自动关门
    map_stable_s: 20.0        # 地图连续这么久没新增已知格，才算真探完
    bootstrap_max_cells: 4000 # 实测值：太大反而卡住（起步要求目标格已知空闲）
    min_goal_m: 1.2           # 最短目标距离（太近会被判"已到达"，车不走）
    bootstrap_forward_m: 1.0  # 雷达起步前进距离
    bootstrap_speed_mps: 0.12
    bootstrap_turn_rate: 0.5
    bootstrap_min_clear_m: 1.3 # 净空小于此值不前进
