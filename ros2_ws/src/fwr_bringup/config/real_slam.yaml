# slam_toolbox 建图参数（2026-10-29 重写）
#
# 崩溃教训：本文件原先把 minimum_travel_distance 设成 0.05、minimum_travel_heading
# 设成 0.1，导致 slam 几乎每帧都加节点，mapper 内部概率搜索结构异常，节点直接
# abort：`Mapper FATAL ERROR - unable to get pointer in probability search!`
# 参见上游 issue：https://github.com/SteveMacenski/slam_toolbox/issues/642
# 该 issue 给出的「不崩」边界：minimum_travel_distance 0.5 / minimum_travel_heading 0.5 /
# scan_buffer_size 10 / stack_size_to_use 40000000。本文件按这套保守值配置。
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # 求解器
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # 坐标系与话题
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_mapping
    mode: mapping

    # 运行参数
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 12.0
    # 2026-11-28 用户报「快建完时整张图突然转 ~30°，之后重影」。
    # 当时配置：本项 0.5 s + 建图摇杆 0.60 rad/s → 相邻两帧之间车已转过 17.2°，
    # 而粗搜索窗口只有 ±20°（余量 1.17 倍）→ 匹配容易锁到隔壁错峰，位姿一步跳十几度。
    # 现在 0.5 → 0.3：转弯时被处理的扫描更密（@0.6 rad/s 帧间角差 17.2° → 10.3°）。
    # 代价：map 模式更吃 CPU（Ceres 已报 50 线程 > 16 线程），所以不再往下压。
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # 关键：不要调小（下面两个值过小会直接触发 mapper 崩溃）
    # 2026-11-19 用户批准：0.5 → 0.25（地图粒度翻倍；0.05/0.1 曾实测 mapper abort，
    # 0.25 距离崩溃值还有 5 倍余量，属低风险档）。回滚：改回 0.5 后重启 fwr-map。
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.25
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # 匹配与回环
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    # 2026-11-28：0.35 → 0.45，0.45 → 0.60。假回环的代价是「整张图被转走 + 重影」，
    # 比漏掉真回环（末端留 1~3° 漂移）严重得多，所以门槛抬高。
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.60

    # 相关搜索（扫描匹配）
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # 回环搜索空间
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # 扫描匹配惩罚（走廊场景不要调太松，太松反而乱转）
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    # 2026-11-28：0.349（±20°）→ 0.52（±30°）。**不要往小改**：
    # 帧间角差本来就 10~17°，窗口收到 15° 会让真值落在窗口外 → 匹配不到、位姿冻结。
    # 放大后相对 10.3° 的余量 1.9 倍（相对 17° 仍 1.76 倍），
    # 由下面的 angle_variance_penalty / minimum_angle_penalty 压住"乱跑"。
    coarse_search_angle_offset: 0.52
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 1.2
    minimum_distance_penalty: 0.5
    use_response_expansion: true
